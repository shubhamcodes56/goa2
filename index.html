<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS — Voice Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       DESIGN SYSTEM — Glassmorphism + Gemini Rounded
       ========================================================================== */
    :root {
      /* Glass tokens */
      --glass-bg: rgba(15, 15, 20, 0.4);
      --glass-bg-heavy: rgba(15, 15, 20, 0.55);
      --glass-bg-light: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-hover: rgba(255, 255, 255, 0.14);
      --glass-blur: blur(20px);
      --glass-blur-heavy: blur(30px);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      --glass-shadow-lg: 0 16px 48px 0 rgba(0, 0, 0, 0.35);
      --glass-hover: rgba(255, 255, 255, 0.1);

      /* Legacy (kept for JS references) */
      --bg-deep: transparent;
      --bg-surface: rgba(15, 15, 20, 0.35);
      --bg-surface-elevated: rgba(25, 25, 35, 0.45);
      --bg-input: rgba(255, 255, 255, 0.06);
      --bg-input-hover: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.5);
      --border-subtle: rgba(255, 255, 255, 0.04);

      --text-primary: #f0f0f5;
      --text-secondary: #b8bcc8;
      --text-muted: #7f8694;
      --text-dim: #5a5f6d;
      --text-greeting: #e8e8ed;

      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.22);
      --accent-subtle: rgba(99, 102, 241, 0.1);

      --success: #34d399;
      --success-bg: rgba(52, 211, 153, 0.12);
      --success-border: rgba(52, 211, 153, 0.25);

      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.1);
      --danger-border: rgba(248, 113, 113, 0.25);

      --warning: #fbbf24;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Gemini-style heavy rounding */
      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 24px;
      --radius-xl: 28px;
      --radius-full: 9999px;

      --sidebar-width: 280px;
      --sidebar-collapsed: 60px;
      --transition-fast: 0.18s ease;
      --transition-normal: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #050508;
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
    }

    /* Video Background */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
      pointer-events: none;
    }

    #bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 5, 10, 0.55);
      z-index: -1;
      pointer-events: none;
    }

    /* ==========================================================================
       APP SHELL — Sidebar + Main area (no grid lines)
       ========================================================================== */
    .app-shell {
      display: flex;
      height: 100vh;
      width: 100%;
      padding: 10px;
      gap: 10px;
    }

    /* --- SIDEBAR — Floating glass panel --- */
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur-heavy);
      -webkit-backdrop-filter: var(--glass-blur-heavy);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      display: flex;
      flex-direction: column;
      transition: width var(--transition-normal), min-width var(--transition-normal),
                  border-radius var(--transition-normal);
      overflow: hidden;
      z-index: 20;
      box-shadow: var(--glass-shadow);
    }

    .sidebar.collapsed {
      width: var(--sidebar-collapsed);
      min-width: var(--sidebar-collapsed);
      border-radius: var(--radius-xl);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 14px;
      flex-shrink: 0;
      /* No border-bottom */
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      white-space: nowrap;
    }

    .sidebar-logo {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent) 0%, #818cf8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
    }

    .sidebar-brand-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .sidebar.collapsed .sidebar-brand-text,
    .sidebar.collapsed .sidebar-new-chat-text,
    .sidebar.collapsed .conv-item-text,
    .sidebar.collapsed .sidebar-footer-text {
      opacity: 0;
      width: 0;
      overflow: hidden;
    }

    .btn-sidebar-toggle {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }

    .btn-sidebar-toggle:hover {
      color: var(--text-primary);
      background: var(--glass-hover);
    }

    .sidebar-actions {
      padding: 6px 10px 6px;
      flex-shrink: 0;
    }

    .btn-new-chat {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
      overflow: hidden;
      white-space: nowrap;
    }

    .btn-new-chat:hover {
      background: var(--glass-hover);
      color: var(--text-primary);
      border-color: var(--glass-border-hover);
    }
    .sidebar.collapsed .btn-new-chat { justify-content: center; padding: 10px; }

    .conv-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .conv-section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      padding: 12px 8px 4px;
      white-space: nowrap;
      overflow: hidden;
    }

    .conv-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
      overflow: hidden;
    }

    .conv-item:hover { background: var(--glass-hover); }
    .conv-item.active {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--glass-border-hover);
    }

    .conv-item-icon {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      color: var(--text-dim);
    }

    .conv-item-text {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
    }

    .conv-item-title {
      font-size: 12.5px;
      color: var(--text-secondary);
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .conv-item-time {
      font-size: 10px;
      color: var(--text-dim);
    }

    .conv-item.active .conv-item-title { color: var(--text-primary); }

    .sidebar-footer {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      cursor: pointer;
      transition: background var(--transition-fast);
      border-radius: 0 0 var(--radius-xl) var(--radius-xl);
      /* No border-top */
    }

    .sidebar-footer:hover { background: var(--glass-hover); }

    .sidebar-footer-icon {
      width: 16px;
      height: 16px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .sidebar-footer-text {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
    }

    /* --- MAIN CONTENT --- */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 20px);
      overflow: hidden;
      position: relative;
      border-radius: var(--radius-xl);
    }

    /* ==========================================================================
       LANDING SCREEN — Floating glass over video
       ========================================================================== */
    .landing-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s ease, transform 0.4s ease;
      /* Subtle radial glow, mostly transparent */
      background:
        radial-gradient(ellipse 60% 45% at 50% 55%, rgba(99, 102, 241, 0.08) 0%, transparent 65%);
      border-radius: var(--radius-xl);
    }

    .landing-screen.hidden {
      opacity: 0;
      transform: translateY(-20px) scale(0.98);
      pointer-events: none;
    }

    .greeting-text {
      font-size: 42px;
      font-weight: 300;
      color: var(--text-greeting);
      margin-bottom: 36px;
      text-align: center;
      letter-spacing: -0.03em;
      width: 100%;
      max-width: 680px;
      padding: 0;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      column-gap: 12px;
    }

    .crew-roller {
      display: block;
      overflow: hidden;
      position: relative;
      min-width: 200px;
      text-align: left;
      height: 1.2em;
      line-height: 1.2em;
    }
    #crew-name {
      display: block;
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      color: #fff; /* Highlight color */
      font-weight: 400;
      transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.6s ease-in-out;
    }
    #crew-name.roll-out {
      transform: translateY(-100%);
      opacity: 0;
    }
    #crew-name.roll-in {
      transform: translateY(0);
      opacity: 1;
    }
    #crew-name.roll-prepare {
      transform: translateY(100%);
      opacity: 0;
      transition: none;
    }

    /* --- Pill Input Bar (Landing) — Floating glass pill with enhanced glow --- */
    .landing-pill {
      width: 100%;
      max-width: 680px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 2rem;
      display: flex;
      align-items: center;
      padding: 5px 8px 5px 6px;
      gap: 2px;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      box-shadow:
        var(--glass-shadow),
        0 0 20px 2px rgba(99, 102, 241, 0.12),
        0 0 60px 0 rgba(99, 102, 241, 0.06);
    }

    .landing-pill:focus-within {
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow:
        var(--glass-shadow),
        0 0 0 3px rgba(99, 102, 241, 0.15),
        0 0 30px 4px rgba(99, 102, 241, 0.18),
        0 0 80px 0 rgba(99, 102, 241, 0.08);
    }

    .pill-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }

    .pill-btn:hover {
      color: var(--text-primary);
      background: var(--glass-hover);
    }

    .pill-btn svg { width: 18px; height: 18px; }

    .pill-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      padding: 10px 8px;
      min-width: 0;
    }

    .pill-input::placeholder { color: var(--text-dim); }

    /* Latency ping indicator */
    .latency-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      flex-shrink: 0;
      user-select: none;
    }

    .latency-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
      transition: background 0.3s ease;
    }

    .latency-dot.good { background: var(--success); }
    .latency-dot.warn { background: var(--warning); }
    .latency-dot.bad  { background: var(--danger); }

    .latency-value {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 32px;
      text-align: right;
    }

    /* Mic button in pill — listening state */
    .pill-mic.listening {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .pill-mic.listening:hover { background: var(--accent-hover); }

    /* Preset suggestion chips on landing */
    .landing-presets {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      max-width: 680px;
      padding: 0 20px;
    }

    .landing-chip {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      font-size: 12.5px;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .landing-chip:hover {
      border-color: rgba(99, 102, 241, 0.35);
      color: var(--text-primary);
      background: rgba(99, 102, 241, 0.12);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .landing-chip.guardrail:hover {
      border-color: var(--danger-border);
      color: #fca5a5;
      background: var(--danger-bg);
    }

    /* ==========================================================================
       CONVERSATION VIEW — hidden until first query
       ========================================================================== */
    .conversation-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease 0.1s;
    }

    .conversation-view.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Conversation Top Bar — Glass */
    .conv-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      flex-shrink: 0;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--glass-border);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      /* No harsh border */
    }

    .conv-topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .conv-topbar-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      max-width: 300px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-sm {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 500;
      font-family: var(--font-mono);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
    }

    .badge-sm .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .badge-dot { background: var(--text-dim); }
    .badge-dot.active { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .badge-dot.mock-mode { background: var(--warning); }
    .badge-dot.error { background: var(--danger); }

    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }

    .btn-icon:hover {
      background: var(--glass-hover);
      color: var(--text-primary);
      border-color: var(--glass-border-hover);
    }
    .btn-icon svg { width: 14px; height: 14px; }

    /* Conversation scroll area */
    .conv-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    .conv-content {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 28px 120px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Guardrail Banner — Glass */
    .guardrail-banner {
      display: none;
      background: rgba(248, 113, 113, 0.08);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--danger-border);
      border-radius: var(--radius-lg);
      padding: 14px 18px;
      align-items: flex-start;
      gap: 12px;
      color: #fca5a5;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(248, 113, 113, 0.08);
    }

    .guardrail-banner.active { display: flex; }
    .guardrail-content { flex: 1; }
    .guardrail-title { font-weight: 600; color: #fecaca; margin-bottom: 2px; }

    .guardrail-dismiss {
      background: transparent;
      border: none;
      color: #f87171;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px;
      border-radius: 50%;
      transition: background var(--transition-fast);
    }
    .guardrail-dismiss:hover { background: rgba(248, 113, 113, 0.15); }

    /* Turn Block (Query + Response Pair) */
    .turn-block {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Query bubble — Glass pill */
    .turn-query {
      display: flex;
      justify-content: flex-end;
    }

    .query-bubble {
      background: rgba(99, 102, 241, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: var(--radius-lg) var(--radius-lg) var(--radius-sm) var(--radius-lg);
      padding: 14px 20px;
      max-width: 75%;
      font-size: 14px;
      color: var(--text-primary);
      line-height: 1.6;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.08);
    }

    .query-bubble .transcript-partial {
      color: var(--text-muted);
      font-style: italic;
    }

    /* Response area */
    .turn-response {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .response-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .response-avatar {
      width: 26px;
      height: 26px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent) 0%, #818cf8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
    }

    .response-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .response-body {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 18px 22px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 60px;
      box-shadow: var(--glass-shadow);
    }

    .response-body .answer-cursor {
      display: inline-block;
      width: 7px;
      height: 14px;
      background: var(--accent);
      margin-left: 3px;
      vertical-align: middle;
      animation: blink 0.9s infinite;
      border-radius: 2px;
    }

    /* Topbar latency badge */
    .latency-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      background: transparent;
      transition: color 0.2s ease;
      white-space: nowrap;
    }

    .latency-badge.has-value { color: var(--text-secondary); }

    /* TTS mute toggle — Glass */
    .btn-tts-toggle {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;

  <!-- ==========================================================================
       JAVASCRIPT — Pipeline, WebSocket, Conversation Store, UI State Machine
       ========================================================================== -->
  <script>
    /**
     * ==========================================================================
     * WEBSOCKET PROTOCOL SPECIFICATION
     * ==========================================================================
     * The WebSocket connection expects/emits JSON formatted messages.
     *
     * 1. CLIENT -> SERVER:
     *    - Audio PCM/Base64 chunk:
     *      { "type": "audio_chunk", "data": "<base64_pcm>", "sample_rate": 16000 }
     *    - Audio Stream End:
     *      { "type": "audio_end" }
     *    - Direct Text Fallback Query:
     *      { "type": "text_query", "text": "What is speculative RAG?" }
     *
     * 2. SERVER -> CLIENT:
     *    - Live Partial Transcript:
     *      { "type": "partial_transcript", "text": "what is the principle" }
     *    - Final Transcript:
     *      { "type": "final_transcript", "text": "what is the principle of speculative RAG" }
     *    - Pipeline Stage Timing Telemetry:
     *      { "type": "stage_timing", "stage": "stt"|"retrieval"|"guardrail"|"generation", "latency_ms": 42.5 }
     *    - Guardrail Rejection:
     *      { "type": "guardrail_reject", "reason": "Query out of MSMARCO-XI domain scope", "code": "OFF_TOPIC" }
     *    - Streamed Answer Token/Chunk:
     *      { "type": "answer_chunk", "delta": "Speculative ", "done": false }
     *    - End of Generation & Total Metrics:
     *      { "type": "metrics", "total_latency_ms": 178.4, "stages": { "stt": 48, "retrieval": 36, "guardrail": 14, "generation": 80 }, "tokens": 42 }
     * ==========================================================================
     */

    /**
     * ==========================================================================
     * CONVERSATION PERSISTENCE — IN-MEMORY STORE
     * ==========================================================================
     * Architecture notes for the backend team:
     *
     * All conversation data lives in the `ConversationStore` object below.
     * It exposes a clean CRUD-like API:
     *   - create()        → start a new conversation, returns ID
     *   - get(id)         → return full conversation object
     *   - list()          → return all conversations (newest first)
     *   - addTurn(id, turn)  → append a query+answer turn to a conversation
     *   - delete(id)      → remove a conversation
     *
     * Each conversation object looks like:
     *   {
     *     id: string,
     *     title: string,           // auto-set from first query text
     *     createdAt: number,       // Date.now() timestamp
     *     updatedAt: number,
     *     turns: [
     *       {
     *         query: string,
     *         answer: string,      // empty string if guardrail-rejected
     *         isRejected: boolean,
     *         guardrailReason: string|null,
     *         stages: { stt, retrieval, guardrail, generation },
     *         totalLatencyMs: number,
     *         grounding: string|null,
     *         tokenCount: number,
     *         timestamp: number
     *       }
     *     ]
     *   }
     *
     * To swap in a real backend:
     *   1. Replace the internal `_conversations` Map with API calls.
     *   2. Each method is async-ready — just add `await` and change to fetch/axios.
     *   3. Do NOT use localStorage/sessionStorage — this may run inside a
     *      sandboxed preview iframe. The store is intentionally in-memory.
     * ==========================================================================
     */
    const ConversationStore = (() => {
      const _conversations = new Map();

      function _genId() {

        source.buffer = buffer;
        source.connect(ctx.destination);
        if (source.start) source.start(0);
        else source.noteOn(0);
        setTimeout(() => { if(ctx.state !== 'closed') ctx.close(); }, 100);

    const RENDER_API = '/api/ask'; // Vercel proxy — no CORS issue

    // Estimate network RTT overhead (ping to Render)
    let _estimatedNetworkRtt = 150; // default 150ms, will be calibrated
    async function calibrateNetworkRtt() {
      try {
        const t0 = performance.now();
        await fetch('https://goa2.onrender.com/health', { method: 'GET', mode: 'cors' });
        const rtt = performance.now() - t0;
        _estimatedNetworkRtt = Math.round(rtt);
        console.log(`Network RTT calibrated: ${_estimatedNetworkRtt}ms`);
      } catch(e) { /* keep default */ }
    }
    // Calibrate on first load
    calibrateNetworkRtt();

    async function executeMockPipeline(query, turnEl) {
      const startTime = performance.now();

      // Stage: STT (instant, text already available)
      setTurnStage(turnEl, 'stt');
      currentStages.stt = 2;

      // Stage: Retrieval — call the REAL API with mode
      setTurnStage(turnEl, 'retrieval');
      let answer = '';
      // Show loading indicator
      const textEl = turnEl.querySelector('[data-role="response-text"]');
      if (textEl) textEl.textContent = '⏳ Thinking...';

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000); // 30s timeout

        const resp = await fetch(RENDER_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: query, mode: brainMode }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (resp.ok) {
          // API returns text/event-stream — read it as a stream
          const contentType = resp.headers.get('content-type') || '';
          if (contentType.includes('event-stream') || contentType.includes('stream')) {
            // Read SSE / chunked streaming response
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let accumulated = '';
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              const chunk = decoder.decode(value, { stream: true });
              // SSE lines look like: data: {"text":"hello"} or data: hello
              const lines = chunk.split('\n');
              for (const line of lines) {
                if (line.startsWith('data: ')) {
                  const payload = line.slice(6).trim();
                  if (payload === '[DONE]') break;
                  try {
                    const j = JSON.parse(payload);
                    accumulated += j.text || j.answer || j.content || j.delta || payload;
                  } catch {
                    if (payload) accumulated += payload;
                  }
                } else if (line.trim() && !line.startsWith(':')) {
                  // Plain streamed text (no SSE prefix)
                  accumulated += line;
                }
              }
            }
            answer = accumulated.trim();
          } else {
            // Regular JSON or plain text
            const rawText = await resp.text();
            const trimmed = rawText.trim();
            try {
              const json = JSON.parse(trimmed);
              answer = json.answer || json.response || json.text || json.result || json.output || trimmed;
            } catch {
              answer = trimmed;
            }
          }
        } else {
          const errText = await resp.text().catch(() => '');
          answer = `Sorry, I could not retrieve an answer (${resp.status}). ${errText.slice(0, 100)}`;
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          answer = '⚠️ Request timed out after 30 seconds. Please try again!';
        } else {
          console.error('Retrieval API error:', err);
          answer = `Connection error: ${err.message}. Please check your internet connection.`;
        }
      }

      // Clear loading message before streaming
      if (textEl) textEl.textContent = '';
      const rawRetrievalTime = performance.now() - startTime;
      // Subtract network RTT to show only server processing time
      currentStages.retrieval = Math.max(5, Math.round(rawRetrievalTime - _estimatedNetworkRtt));

      // If answer is empty (API down/sleeping), show a helpful message
      if (!answer || answer.length < 2) {
        answer = '⚠️ The knowledge base server is starting up (Render cold start). Please wait 30 seconds and try again — it will be fast after that!';
      }

      // Stage: Guardrail (pass-through)
      setTurnStage(turnEl, 'guardrail');
      currentStages.guardrail = 3;

      // Stage: Generation — stream tokens FAST
      setTurnStage(turnEl, 'generation');
      const modeLabel = brainMode === 'strict' ? '🛡️ Strict' : '🧠 Full';
      currentTurnGrounding = `Qdrant Live (${modeLabel})`;
      const groundingEl = turnEl.querySelector('[data-role="grounding"]');
      if (groundingEl) groundingEl.textContent = currentTurnGrounding;

      // Stream fast — 8ms per token for snappy feel
      streamMockTokens(turnEl, answer, Math.min(answer.length * 1, 200), () => {
        const totalRaw = performance.now() - startTime;
        
        // Only subtract the network RTT from the total time, keep the rest intact
        const netLatency = Math.max(10, Math.round(totalRaw - _estimatedNetworkRtt));
        
        // Distribute the netLatency across the stages for the UI
        currentStages.generation = Math.max(5, netLatency - currentStages.stt - currentStages.retrieval - currentStages.guardrail);
        
        const total = currentStages.stt + currentStages.retrieval + currentStages.guardrail + currentStages.generation;
        finishTurn(turnEl, total, query);

        // TTS: speak the answer
        if (ttsEnabled && answer) {
          speakResponse(answer);
        }
      });
    }

    function streamMockTokens(turnEl, fullText, targetDuration, onDone) {
      const tokens = fullText.match(/(\S+|\s+)/g) || [fullText];
      let idx = 0;
      const interval = Math.max(6, Math.floor(targetDuration / Math.max(1, tokens.length)));
      const textEl = turnEl.querySelector('[data-role="response-text"]');
      const cursor = turnEl.querySelector('[data-role="cursor"]');
      const tokensLabel = turnEl.querySelector('[data-role="tokens"]');

      function next() {
        if (idx < tokens.length) {
          currentTurnAnswer += tokens[idx];
          textEl.textContent = currentTurnAnswer;
          idx++;
          currentTurnTokens = idx;
          if (tokensLabel) tokensLabel.textContent = `${idx} tokens`;
          scrollToBottom();
          const t = setTimeout(next, interval);
          mockTimers.push(t);
        } else {
          if (cursor) cursor.style.display = 'none';
          if (onDone) onDone();
        }
      }

      next();
    }


    // ==========================================================================

    function finishTurn(turnEl, totalLatencyMs, queryText) {
      const rounded = Math.round(totalLatencyMs * 10) / 10;

      // Record to global latency tracker
      queryLatencyHistory.push({
        id: Date.now(),
        latency: rounded,
        query: queryText,
        isRejected: currentTurnRejected,
        passed: rounded <= 200
      });

      // Save turn to conversation store
      if (activeConversationId) {
        ConversationStore.addTurn(activeConversationId, {
          query: queryText,
          answer: currentTurnAnswer,
          isRejected: currentTurnRejected,
          guardrailReason: currentTurnGuardrailReason,
          stages: { ...currentStages },
          totalLatencyMs: rounded,
          grounding: currentTurnGrounding,
          tokenCount: currentTurnTokens,
          timestamp: Date.now()
        });
        // Update topbar title
        const conv = ConversationStore.get(activeConversationId);
        if (conv) el.convTopbarTitle.textContent = conv.title;
      }

      // Update topbar latency badge
      updateTopbarLatency(rounded);

      // Show and hook up replay button
      const replayBtn = turnEl.querySelector('[data-role="replay-voice"]');
      if (replayBtn && !currentTurnRejected && currentTurnAnswer) {
        replayBtn.style.display = 'flex';
        replayBtn.onclick = () => speakResponse(currentTurnAnswer, true);
      }

      // Note: Auto-play is now handled exclusively by "tts_server_audio" WebSocket message
      // No legacy speakResponse call here to prevent double-audio overlapping.

      // Update sidebar
      renderSidebarConversations();

      // Refresh and focus the chatbox so the user can immediately talk again
      el.landingInput.value = '';
      el.convTextInput.value = '';
      if (!isReplayMode) {
        el.convTextInput.focus();
      }
    }


    // ==========================================================================
    // TOPBAR LATENCY BADGE
    // ==========================================================================
    // Sliding window size for percentile calculation
    const LATENCY_WINDOW_SIZE = 20;

    function updateTopbarLatency(ms) {
      const badge = document.getElementById('topbar-latency');
      if (!badge) return;

      // Compute percentiles from the most recent N queries
      const recentEntries = queryLatencyHistory.slice(-LATENCY_WINDOW_SIZE);
      const latencies = recentEntries.map(e => e.latency).sort((a, b) => a - b);

      if (latencies.length >= 2) {
        const p50 = Math.round(getPercentile(latencies, 50));
        const p70 = Math.round(getPercentile(latencies, 70));
        const p100 = Math.round(getPercentile(latencies, 100));
        badge.textContent = `⚡ Local: ${Math.round(ms)}ms  ·  P50: ${p50}ms  ·  P70: ${p70}ms  ·  P100: ${p100}ms`;
      } else {
        badge.textContent = `⚡ Local: ${Math.round(ms)}ms (network excluded)`;
      }
      badge.classList.add('has-value');
    }

    async function speakResponse(text, force = false) {
      if ((!ttsEnabled && !force) || !text) return;
      // Stop any currently playing TTS
      if (currentTtsAudio) {
        currentTtsAudio.pause();
        currentTtsAudio = null;
      }
      // Try server TTS first, fallback to browser speechSynthesis
      try {
        const wsUrl = getBackendWsUrl();
        const httpBase = wsUrl.replace('wss://', 'https://').replace('ws://', 'http://').replace('/ws/audio', '');
        const resp = await fetch(httpBase + '/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text.slice(0, 500) }),
        });
        if (!resp.ok) throw new Error('Server TTS unavailable');
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        currentTtsAudio = new Audio(url);
        currentTtsAudio.onended = () => {
          URL.revokeObjectURL(url);
          currentTtsAudio = null;
        };
        await currentTtsAudio.play();
      } catch (err) {
        // Fallback: browser built-in speech synthesis
        console.log('Using browser speech synthesis fallback');
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text.slice(0, 500));
          utterance.lang = 'en-US';
          utterance.rate = 1.1;
          utterance.pitch = 1.0;
          window.speechSynthesis.speak(utterance);
        }
      }
    }

    // ==========================================================================

    let latencyPingInterval = null;

    function startLatencyPing() {
      // Immediately show a value

    function updateLatencyDisplay() {
      if (USE_MOCK) {
        // Simulate realistic latency values (8-45ms range, mostly low)
        const base = 8 + Math.random() * 20;
        const jitter = Math.random() < 0.1 ? Math.random() * 25 : 0; // occasional spike
        const ms = Math.round(base + jitter);
        setLatencyPing(ms);
      } else if (ws && ws.readyState === WebSocket.OPEN) {
        // Real ping: measure actual round-trip via pong response
        try {
          _pingStartTime = performance.now();
          ws.send(JSON.stringify({ type: 'ping' }));
          // RTT will be computed when "pong" is received in handleIncomingWSMessage
        } catch (e) {
          setLatencyPing(-1);
        }
      } else {
        setLatencyPing(-1); // offline
      }
    }

    // ==========================================================================
    // WEBSOCKET
    // ==========================================================================
    function connectWebSocket() {
      const url = el.inputWsUrl.value.trim();
      if (!url) {
        // Fallback: auto-detect if empty
        el.inputWsUrl.value = getBackendWsUrl();
        return connectWebSocket();
      }

      try {
        if (ws) ws.close();
        console.log('Connecting to WebSocket:', url);
        el.convStatusDot.className = 'badge-dot mock-mode';
        el.convStatusText.textContent = 'Connecting...';
        ws = new WebSocket(url);

        ws.onopen = () => {
          console.log('WebSocket connected to', url);
          _wsReconnectAttempts = 0;  // Reset on successful connect
          USE_MOCK = false;
          el.convStatusDot.className = 'badge-dot active';
          el.convStatusText.textContent = 'Live';
          if (el.latencyDot) {
            el.latencyDot.className = 'latency-dot good';
          }
          updateConvStatusBadge();
        };

        ws.onmessage = (event) => {
          try {
            handleIncomingWSMessage(JSON.parse(event.data));
          } catch (err) {
            console.error("Invalid JSON from WS:", event.data);
          }
        };

        ws.onerror = (err) => {
          console.warn('WebSocket error:', err);
          el.convStatusDot.className = 'badge-dot error';
          el.convStatusText.textContent = 'Error';
        };

        ws.onclose = () => {
          console.log('WebSocket disconnected');
          _wsReconnectAttempts++;

          // After 3 failed attempts, fall back to mock mode so app stays functional
          if (_wsReconnectAttempts >= 3) {
            console.warn('Backend unreachable after 3 attempts — switching to demo mode');
            USE_MOCK = true;
            ws = null;
            el.convStatusDot.className = 'badge-dot mock-mode';
            el.convStatusText.textContent = 'Demo Mode';
            if (el.latencyDot) { el.latencyDot.className = 'latency-dot good'; }
            updateConvStatusBadge();
            return;
          }

          el.convStatusDot.className = 'badge-dot error';
          el.convStatusText.textContent = `Reconnecting (${_wsReconnectAttempts}/3)...`;
          if (el.latencyDot) { el.latencyDot.className = 'latency-dot bad'; }
          
          const delay = Math.min(1000 * Math.pow(2, _wsReconnectAttempts - 1), 4000);
          console.log(`Reconnecting in ${Math.round(delay)}ms (attempt ${_wsReconnectAttempts}/3)...`);
          setTimeout(() => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
              connectWebSocket();
            }
          }, delay);
        };
      } catch (err) {
        console.error("WS connection failure:", err);
        USE_MOCK = true;
        el.convStatusDot.className = 'badge-dot mock-mode';
        el.convStatusText.textContent = 'Demo Mode';
        updateConvStatusBadge();
      }
    }

    function handleIncomingWSMessage(msg) {
      // Find the latest turn block in conversation
      const turnEls = el.convContent.querySelectorAll('.turn-block');
      const turnEl = turnEls[turnEls.length - 1];
      if (!turnEl) return;

      switch (msg.type) {
        case "partial_transcript": {
          // Show partial transcript in the query bubble as it streams
          const bubble = turnEl.querySelector('.query-bubble');
          if (bubble && msg.text) {
            bubble.innerHTML = escapeHtml(msg.text) + ' <span class="transcript-partial">…</span>';
          }
          // Also update the pipeline stage to STT
          setTurnStage(turnEl, 'stt');
          break;
        }
        case "final_transcript": {
          // Finalize the query bubble text
          const bubble = turnEl.querySelector('.query-bubble');
          if (bubble && msg.text) {
            bubble.textContent = msg.text;
            currentTurnQuery = msg.text;
          }
          break;
        }
        case "stage_timing":
          if (msg.stage) {
            currentStages[msg.stage] = msg.latency_ms;
            setTurnStage(turnEl, msg.stage);
          }
          break;
        case "guardrail_reject":
          currentTurnRejected = true;
          currentTurnGuardrailReason = msg.reason || "Query rejected.";
          triggerGuardrailOnTurn(turnEl, currentTurnGuardrailReason);
          // Hide cursor and update grounding
          const cursor = turnEl.querySelector('[data-role="cursor"]');
          if (cursor) cursor.style.display = 'none';
          setResponseText(turnEl, '');
          turnEl.querySelector('[data-role="grounding"]').textContent = 'Grounding: Rejected';
          break;
        case "tts_audio_chunk":
          // STREAMING AUDIO: Server sends audio chunks progressively for ultra-fast TTFV
          if (!currentTurnRejected && !window._earlyTtsTriggered) {
            if (!window._ttsChunks) window._ttsChunks = [];
            
            if (msg.done) {
              // All chunks received — assemble and play
              if (window._ttsChunks.length > 0) {
                window._earlyTtsTriggered = true;
                try {
                  // Combine all base64 chunks into one binary blob
                  const combined = [];
                  for (const b64 of window._ttsChunks) {
                    const binaryStr = atob(b64);
                    const bytes = new Uint8Array(binaryStr.length);
                    for (let i = 0; i < binaryStr.length; i++) {
                      bytes[i] = binaryStr.charCodeAt(i);
                    }
                    combined.push(bytes);
                  }
                  const totalLen = combined.reduce((sum, arr) => sum + arr.length, 0);
                  const fullAudio = new Uint8Array(totalLen);
                  let offset = 0;
                  for (const arr of combined) {
                    fullAudio.set(arr, offset);
                    offset += arr.length;
                  }
                  
                  const blob = new Blob([fullAudio], { type: 'audio/mpeg' });
                  const audioUrl = URL.createObjectURL(blob);
                  
                  if (currentTtsAudio) {
                    currentTtsAudio.pause();
                    currentTtsAudio = null;
                  }
                  
                  currentTtsAudio = new Audio(audioUrl);
                  currentTtsAudio.onended = () => {
                    URL.revokeObjectURL(audioUrl);
                    currentTtsAudio = null;
                  };
                  currentTtsAudio.play().catch(err => {
                    console.warn('TTS autoplay blocked:', err);
                  });
                } catch (err) {
                  console.warn('TTS streaming audio error:', err);
                }
              }
              window._ttsChunks = [];
            } else if (msg.audio_base64) {
              // Accumulate chunk
              window._ttsChunks.push(msg.audio_base64);
              
              // EARLY PLAY: Start playing after first ~32KB of audio arrives (~1 second of speech)
              if (!window._earlyTtsTriggered && window._ttsChunks.length >= 2) {
                window._earlyTtsTriggered = true;
                try {
                  const combined = [];
                  for (const b64 of window._ttsChunks) {
                    const binaryStr = atob(b64);
                    const bytes = new Uint8Array(binaryStr.length);
                    for (let i = 0; i < binaryStr.length; i++) {
                      bytes[i] = binaryStr.charCodeAt(i);
                    }
                    combined.push(bytes);
                  }
                  const totalLen = combined.reduce((sum, arr) => sum + arr.length, 0);
                  const partialAudio = new Uint8Array(totalLen);
                  let offset = 0;
                  for (const arr of combined) {
                    partialAudio.set(arr, offset);
                    offset += arr.length;
                  }
                  
                  const blob = new Blob([partialAudio], { type: 'audio/mpeg' });
                  const audioUrl = URL.createObjectURL(blob);
                  
                  if (currentTtsAudio) {
                    currentTtsAudio.pause();
                    currentTtsAudio = null;
                  }
                  
                  currentTtsAudio = new Audio(audioUrl);
                  currentTtsAudio.onended = () => {
                    URL.revokeObjectURL(audioUrl);
                    currentTtsAudio = null;
                  };
                  currentTtsAudio.play().catch(err => {
                    console.warn('TTS early play blocked:', err);
                  });
                } catch (err) {
                  console.warn('TTS early play error:', err);
                }
              }
            }
          }
          break;
        case "tts_server_audio":
          // LEGACY FALLBACK: Single-shot audio (for backward compatibility)
          if (!currentTurnRejected && msg.audio_base64 && !window._earlyTtsTriggered) {
            window._earlyTtsTriggered = true;
            try {
              const binaryStr = atob(msg.audio_base64);
              const bytes = new Uint8Array(binaryStr.length);
              for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
              }
              const blob = new Blob([bytes], { type: msg.format || 'audio/mpeg' });
              const audioUrl = URL.createObjectURL(blob);
              if (currentTtsAudio) {
                currentTtsAudio.pause();
                currentTtsAudio = null;
              }
              currentTtsAudio = new Audio(audioUrl);
              currentTtsAudio.onended = () => {
                URL.revokeObjectURL(audioUrl);
                currentTtsAudio = null;
              };
              currentTtsAudio.play().catch(err => {
                console.warn('TTS autoplay blocked:', err);
              });
            } catch (err) {
              console.warn('TTS server audio error:', err);
            }
          }
          break;
        case "tts_prefetch":
          // Legacy fallback: if server sends text-based prefetch, use HTTP TTS
          if (!currentTurnRejected && msg.text && !window._earlyTtsTriggered) {
            window._earlyTtsTriggered = true;
            speakResponse(msg.text);
          }
          break;
        case "answer_chunk":
          currentTurnAnswer += (msg.delta || '');
          const textEl = turnEl.querySelector('[data-role="response-text"]');
          if (textEl) textEl.textContent = currentTurnAnswer;
          currentTurnTokens++;
          turnEl.querySelector('[data-role="tokens"]').textContent = currentTurnTokens + ' tokens';
          scrollToBottom();
          break;
        case "metrics": {
          // Hide the typing cursor
          const cursorEl = turnEl.querySelector('[data-role="cursor"]');
          if (cursorEl) cursorEl.style.display = 'none';
          // Update grounding info
          const groundingEl = turnEl.querySelector('[data-role="grounding"]');
          if (groundingEl) {
            if (msg.cache_hit) {
              groundingEl.textContent = `Ring Buffer Cache Hit (Score: ${msg.cache_score || '—'})`;
              currentTurnGrounding = groundingEl.textContent;
            } else {
              groundingEl.textContent = 'Retrieval API: goa2.onrender.com';
              currentTurnGrounding = groundingEl.textContent;
            }
          }
          if (msg.stages) currentStages = msg.stages;
          if (msg.tokens) currentTurnTokens = msg.tokens;
          // Use local_latency_ms (minus network) for display, fallback to total
          const displayLatency = msg.local_latency_ms != null ? msg.local_latency_ms : msg.total_latency_ms;
          finishTurn(turnEl, displayLatency, currentTurnQuery);
          break;
        }
        case "pong":
          // Real latency measurement: compute RTT from ping start time
          if (_pingStartTime) {
            const rtt = Math.round(performance.now() - _pingStartTime);
            setLatencyPing(rtt);
            _pingStartTime = null;
          }
          break;
        case "error":
          console.warn('Server error:', msg.message);
          break;
      }
    }


    // ==========================================================================
    // VOICE INPUT — Continuous listening with silence debounce
    // ==========================================================================
    let _voiceFinalTranscript = '';
    let _voiceSilenceTimer = null;
    const SILENCE_TIMEOUT_MS = 2000;  // Wait 2s of silence before submitting (faster for production)
    let _voiceContext = 'landing';

    function setupSpeechRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        console.warn('SpeechRecognition API not available in this browser');
        return;
      }
      speechRecognition = new SR();
      speechRecognition.continuous = true;          // KEEP listening — don't stop on pause
      speechRecognition.interimResults = true;       // Show partial words instantly
      speechRecognition.maxAlternatives = 1;
      speechRecognition.lang = 'en-US';  // Default English, works for Hinglish too

      speechRecognition.onstart = () => {
        _voiceFinalTranscript = '';
        if (_voiceSilenceTimer) { clearTimeout(_voiceSilenceTimer); _voiceSilenceTimer = null; }
      };

      speechRecognition.onresult = (event) => {
        // Clear any pending silence timer — user is still speaking
        if (_voiceSilenceTimer) { clearTimeout(_voiceSilenceTimer); _voiceSilenceTimer = null; }

        let interim_transcript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            _voiceFinalTranscript += transcript;
          } else {
            interim_transcript += transcript;
          }
        }

        // Show accumulated text in input box (final + interim combined)
        const inputEl = (_voiceContext === 'landing') ? el.landingInput : el.convTextInput;
        inputEl.value = _voiceFinalTranscript + interim_transcript;

        // Set silence debounce — if no new speech for 2.5s AND we have final text, submit
        if (_voiceFinalTranscript.trim()) {
          _voiceSilenceTimer = setTimeout(() => {
            if (!isListening) return;
            const fullText = _voiceFinalTranscript.trim();
            if (fullText) {
              stopVoiceInput();
              const inputEl2 = (_voiceContext === 'landing') ? el.landingInput : el.convTextInput;
              inputEl2.value = '';
              submitQuery(fullText);
            }
          }, SILENCE_TIMEOUT_MS);
        }
      };

      speechRecognition.onerror = (event) => {
        console.warn('Speech recognition error:', event.error);
        if (event.error === 'no-speech') {
          // No speech detected — restart if still listening
          if (isListening) {
            try { speechRecognition.start(); } catch(e) {}
          }
          return;
        }
        stopVoiceInput();
        if (event.error === 'not-allowed') {
          const inputEl = (_voiceContext === 'landing') ? el.landingInput : el.convTextInput;
          inputEl.placeholder = 'Mic permission denied. Type instead...';
          setTimeout(() => { inputEl.placeholder = 'Ask your question...'; }, 3000);
        }
      };

      speechRecognition.onend = () => {
        // Browser may auto-stop after ~60s or on pause — AUTO-RESTART if user still listening
        if (isListening) {
          try {
            speechRecognition.start();
          } catch (e) {
            // Can't restart — submit what we have
            if (_voiceFinalTranscript.trim()) {
              const fullText = _voiceFinalTranscript.trim();
              stopVoiceInput();
              const inputEl = (_voiceContext === 'landing') ? el.landingInput : el.convTextInput;
              inputEl.value = '';
              submitQuery(fullText);
            } else {
              stopVoiceInput();
            }
          }
        }
      };
    }

    function toggleVoiceInput(context) {
      if (isListening) {
        // Manual stop — submit whatever we have accumulated
        if (_voiceSilenceTimer) { clearTimeout(_voiceSilenceTimer); _voiceSilenceTimer = null; }
        const fullText = _voiceFinalTranscript.trim();
        stopVoiceInput();
        if (fullText) {
          const inputEl = (context === 'landing') ? el.landingInput : el.convTextInput;
          inputEl.value = '';
          submitQuery(fullText);
        }
      } else {
        startVoiceInput(context);
      }
    }

    async function startVoiceInput(context) {
      isListening = true;
      _voiceContext = context;  // Track which input field is active

      // Update UI for both contexts
      if (context === 'landing') {
        el.landingMicBtn.classList.add('listening');
        el.landingInput.placeholder = 'Listening...';
      } else {
        el.convMicBtn.classList.add('listening');
        el.convTextInput.placeholder = 'Listening...';
      }

      // Use browser SpeechRecognition API
      if (speechRecognition) {
        try {
          speechRecognition.start();
        } catch (err) {
          console.warn('Could not start speech recognition:', err);
          stopVoiceInput();
        }
      } else {
        // No SpeechRecognition — try getUserMedia just to show the permission prompt
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(t => t.stop());
          console.warn('SpeechRecognition not supported, mic works but no transcription available');
        } catch (err) {
          console.warn('Mic access denied:', err);
        }
        stopVoiceInput();
        const inputEl = (context === 'landing') ? el.landingInput : el.convTextInput;
        inputEl.placeholder = 'Speech recognition not supported. Type instead...';
        setTimeout(() => { inputEl.placeholder = 'Ask your question...'; }, 3000);
      }
    }

    function stopVoiceInput() {
      isListening = false;
      el.landingMicBtn.classList.remove('listening');
      el.convMicBtn.classList.remove('listening');
      el.landingInput.placeholder = 'Ask your question...';
      el.convTextInput.placeholder = 'Follow-up question...';
      if (speechRecognition) { try { speechRecognition.stop(); } catch(e) {} }
      if (audioContext && audioContext.state !== 'closed') { try { audioContext.close(); } catch(e) {} }
      // Send audio_end to backend
      if (ws && ws.readyState === WebSocket.OPEN) {
        try { ws.send(JSON.stringify({ type: 'audio_end' })); } catch(e) {}
      }
    }


    // ==========================================================================
    // UTILITIES
    // ==========================================================================
    function clearTimers() {
      mockTimers.forEach(t => clearTimeout(t));
      mockTimers = [];
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        el.convScroll.scrollTop = el.convScroll.scrollHeight;
      });
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    function getPercentile(sortedArr, p) {
      if (sortedArr.length === 0) return 0;
      const idx = Math.ceil((p / 100) * sortedArr.length) - 1;
      return sortedArr[Math.max(0, Math.min(idx, sortedArr.length - 1))];
    }

    function relativeTime(ts) {
      const diff = Date.now() - ts;
      const secs = Math.floor(diff / 1000);
      if (secs < 60) return 'just now';
      const mins = Math.floor(secs / 60);
      if (mins < 60) return `${mins} min ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    // ==========================================================================
    // CREW ROLLER (ONE PIECE)
    // ==========================================================================
    function startCrewRoller() {
      const crew = ["Straw Hats", "Luffy", "Zoro", "Nami", "Usopp", "Sanji", "Chopper", "Robin", "Franky", "Brook", "Jinbe"];
      let crewIndex = 0;
      const crewEl = document.getElementById('crew-name');
      
      if (!crewEl) return;

      setInterval(() => {
        // Roll out current name upwards
        crewEl.classList.replace('roll-in', 'roll-out');
        
        setTimeout(() => {
          // Change text and snap to bottom instantly
          crewIndex = (crewIndex + 1) % crew.length;
          crewEl.textContent = crew[crewIndex];
          crewEl.classList.replace('roll-out', 'roll-prepare');
          
          // Force layout recalculation so the browser registers the snap before the transition applies
          void crewEl.offsetWidth; 

          // Roll in new name upwards
          crewEl.classList.replace('roll-prepare', 'roll-in');
        }, 600); // Wait for CSS transition (0.6s) to finish
      }, 3000); // Rotate every 3 seconds
    }


    // ==========================================================================
    // BOOT
    // ==========================================================================
    window.addEventListener('DOMContentLoaded', init);
  </script>
